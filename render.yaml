services:
  - type: web
    name: darkson-ia
    runtime: python
    plan: free
    region: sao-paulo
    buildCommand: pip install -r requirements-web.txt
    startCommand: python ui/run_server.py
    healthCheckPath: /api/status
    disk:
      name: darkson-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGUAGE
        value: pt-BR
      - key: ASSISTANT_NAME
        value: DarkSON
      - key: TTS_ENGINE
        value: edge
      - key: TTS_VOICE
        value: pt-BR-AntonioNeural
      - key: DARKSON_HOST
        value: 0.0.0.0
      - key: DARKSON_DATA_DIR
        value: /var/data
      - key: DARKSON_WHISPER_MODEL
        value: base
      - key: DARKSON_ALLOW_ORIGINS
        value: https://darkson-ia.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
