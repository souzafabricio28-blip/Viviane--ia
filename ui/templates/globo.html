<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkSON - Neural Core</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at center, #0d0d1a 0%, #050510 100%);
            overflow: hidden;
            font-family: 'Consolas', monospace;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0,255,200,0.1);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
        }
        #status-dot {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ffc8;
            z-index: 10;
            transition: all 0.3s;
            box-shadow: 0 0 10px #00ffc8;
        }
        #status-dot.falando { background: #ff0055; box-shadow: 0 0 15px #ff0055; animation: pulse-dot 0.4s ease-in-out infinite; }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.4; }
        }
        #grain {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            opacity: 0.035; mix-blend-mode: overlay;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="grain"></canvas>
    <div id="status-dot"></div>
    <div id="info">DarkSON — neural core</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    // --- SCENE ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020208);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.8, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.maxPolarAngle = Math.PI / 2;
    controls.minPolarAngle = 0.2;

    // --- CONFIG ---
    const NUM_NODOS = 1800;
    const NUM_CONNECTIONS = 3000;

    const colorCyan = new THREE.Color(0x00ffc8);
    const colorGreen = new THREE.Color(0x00ff88);
    const colorMagenta = new THREE.Color(0xff0066);

    const nodePositions = new Float32Array(NUM_NODOS * 3);
    const nodeColors = new Float32Array(NUM_NODOS * 3);
    const nodeSizes = new Float32Array(NUM_NODOS);
    const nodeBasePos = new Float32Array(NUM_NODOS * 3);

    function genNodeColorsSizes() {
        for (let i = 0; i < NUM_NODOS; i++) {
            const px = nodeBasePos[i*3];
            const py = nodeBasePos[i*3+1];
            const pz = nodeBasePos[i*3+2];

            // Use theta/longitude for continent noise
            const theta = Math.atan2(pz, px);
            const phi = Math.acos(Math.max(-1, Math.min(1, -py / 1.2)));

            // Procedural continents via spherical harmonics
            const landNoise = Math.sin(theta * 3 + phi * 2) * Math.cos(phi * 4 + theta * 1.5)
                + Math.sin(theta * 5 + phi * 3) * 0.4 + Math.cos(theta * 2 - phi * 6) * 0.3
                + Math.sin(theta * 7 + phi * 5) * 0.2;
            const isLand = landNoise > 0.0;

            const shade = 0.5 + Math.random() * 0.4;
            if (isLand) {
                const g = (0.15 + Math.random() * 0.35) * shade;
                nodeColors[i*3] = (0.04 + Math.random() * 0.08) * shade;
                nodeColors[i*3+1] = g;
                nodeColors[i*3+2] = (0.02 + Math.random() * 0.04) * shade;
            } else {
                nodeColors[i*3] = (0.01 + Math.random() * 0.04) * shade;
                nodeColors[i*3+1] = (0.03 + Math.random() * 0.06) * shade;
                nodeColors[i*3+2] = (0.15 + Math.random() * 0.25) * shade;
            }

            // Subtle teal network overlay
            const overlay = 0.08 * Math.sin(px * 8 + py * 6 + pz * 8);
            nodeColors[i*3] = Math.min(1, nodeColors[i*3] + overlay * 0.15);
            nodeColors[i*3+1] = Math.min(1, nodeColors[i*3+1] + overlay * 0.8);
            nodeColors[i*3+2] = Math.min(1, nodeColors[i*3+2] + overlay * 0.4);
            nodeSizes[i] = 1 + Math.random() * 2;
        }
    }

    function fillHeadShape() {
        for (let i = 0; i < NUM_NODOS; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 1.2 + (Math.random() - 0.5) * 0.04;
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = -r * Math.cos(phi);
            const z = r * Math.sin(phi) * Math.sin(theta);
            nodePositions[i*3] = x; nodePositions[i*3+1] = y; nodePositions[i*3+2] = z;
            nodeBasePos[i*3] = x; nodeBasePos[i*3+1] = y; nodeBasePos[i*3+2] = z;
        }
        genNodeColorsSizes();
    }

    fillHeadShape();

    function buildLines() {
        const lv = []; const lc = [];
        for (let i = 0; i < NUM_CONNECTIONS; i++) {
            const a = Math.floor(Math.random() * NUM_NODOS);
            const b = Math.floor(Math.random() * NUM_NODOS);
            if (a === b) continue;
            const dist = Math.sqrt(
                (nodeBasePos[a*3]-nodeBasePos[b*3])**2 + (nodeBasePos[a*3+1]-nodeBasePos[b*3+1])**2 + (nodeBasePos[a*3+2]-nodeBasePos[b*3+2])**2
            );
            if (dist > 0.8 || dist < 0.1) continue;
            lv.push(nodeBasePos[a*3], nodeBasePos[a*3+1], nodeBasePos[a*3+2], nodeBasePos[b*3], nodeBasePos[b*3+1], nodeBasePos[b*3+2]);
            const bri = Math.max(0.1, 1 - dist / 0.8) * 0.5;
            // Magenta lines near face hubs, teal-green elsewhere
            const nearFace = (nodeBasePos[a*3+2] > 0.3 || nodeBasePos[b*3+2] > 0.3);
            const isMagenta = Math.random() < 0.15 || (
                nearFace && Math.random() < 0.3
            );
            if (isMagenta) {
                lc.push(bri, 0, bri*0.4, bri, 0, bri*0.4);
            } else {
                lc.push(0, bri*0.9, bri*0.7, 0, bri*0.9, bri*0.7);
            }
        }
        const lg = new THREE.BufferGeometry();
        lg.setAttribute('position', new THREE.Float32BufferAttribute(lv, 3));
        lg.setAttribute('color', new THREE.Float32BufferAttribute(lc, 3));
        return lg;
    }

    const nodeGeo = new THREE.BufferGeometry();
    nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePositions, 3));
    nodeGeo.setAttribute('color', new THREE.BufferAttribute(nodeColors, 3));
    nodeGeo.setAttribute('size', new THREE.BufferAttribute(nodeSizes, 1));

    const nodeMat = new THREE.PointsMaterial({
        size: 0.028, vertexColors: true, transparent: true, opacity: 0.85,
        blending: THREE.AdditiveBlending, sizeAttenuation: true, depthWrite: false,
    });
    const nodeMesh = new THREE.Points(nodeGeo, nodeMat);
    scene.add(nodeMesh);

    let lineGeo = buildLines();
    const lineMat = new THREE.LineBasicMaterial({
        vertexColors: true, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending,
    });
    let lineMesh = new THREE.LineSegments(lineGeo, lineMat);
    scene.add(lineMesh);

    // Load face model from CDN
    const faceLoader = new OBJLoader();
    const faceUrl = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/models/obj/Face.obj';
    let faceReady = false;
    faceLoader.load(faceUrl, (obj) => {
        obj.traverse((c) => {
            if (!c.isMesh) return;
            const pos = c.geometry.attributes.position;
            if (pos.count < 100) return;
            for (let i = 0; i < NUM_NODOS; i++) {
                const idx = Math.floor(Math.random() * pos.count) * 3;
                const s = 1.8;
                nodePositions[i*3] = pos.array[idx] * s;
                nodePositions[i*3+1] = pos.array[idx+1] * s;
                nodePositions[i*3+2] = pos.array[idx+2] * s;
                nodeBasePos[i*3] = nodePositions[i*3];
                nodeBasePos[i*3+1] = nodePositions[i*3+1];
                nodeBasePos[i*3+2] = nodePositions[i*3+2];
            }
            faceReady = true;
            nodeGeo.attributes.position.needsUpdate = true;
            scene.remove(lineMesh);
            lineMesh.geometry.dispose();
            lineGeo = buildLines();
            lineMesh = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(lineMesh);
        });
    }, undefined, () => {});
    setTimeout(() => {
        if (!faceReady) {
            fillHeadShape();
            nodeGeo.attributes.position.needsUpdate = true;
            scene.remove(lineMesh);
            lineMesh.geometry.dispose();
            lineGeo = buildLines();
            lineMesh = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(lineMesh);
        }
    }, 6000);

    // --- 3. OUTER GLOW RING ---
    const ringPoints = [];
    for (let i = 0; i <= 80; i++) {
        const theta = (i / 80) * Math.PI * 2;
        const radius = 1.2 * 1.7;
        ringPoints.push(new THREE.Vector3(
            Math.cos(theta) * radius,
            Math.sin(theta) * radius * 0.25,
            0
        ));
    }
    const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPoints);
    const ringMat = new THREE.LineBasicMaterial({
        color: 0x00ffc8,
        transparent: true,
        opacity: 0.08,
    });
    const ring = new THREE.Line(ringGeo, ringMat);
    ring.rotation.x = 0.4;
    scene.add(ring);

    const ring2 = ring.clone();
    ring2.material = ringMat.clone();
    ring2.material.opacity = 0.04;
    ring2.material.color.setHex(0xff0066);
    ring2.rotation.z = 1.0;
    ring2.scale.set(1.3, 1.3, 1.3);
    scene.add(ring2);

    // --- 4. FLOATING DATA PANELS ---
    const canvas2d = document.createElement('canvas');
    canvas2d.width = 256;
    canvas2d.height = 128;
    const ctx = canvas2d.getContext('2d');

    function drawPanel(ctx, lines, color) {
        ctx.clearRect(0, 0, 256, 128);
        ctx.fillStyle = 'rgba(5,5,16,0.6)';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(4, 4, 248, 120, 8);
        ctx.fill();
        ctx.stroke();

        ctx.font = '10px Consolas';
        ctx.fillStyle = color;
        for (let i = 0; i < lines.length; i++) {
            ctx.fillText(lines[i], 16, 20 + i * 14);
        }
    }

    function createPanel(lines, color, pos) {
        drawPanel(ctx, lines, color);
        const tex = new THREE.CanvasTexture(canvas2d);
        tex.minFilter = THREE.LinearFilter;
        const mat = new THREE.SpriteMaterial({
            map: tex,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const sprite = new THREE.Sprite(mat);
        sprite.position.set(pos.x, pos.y, pos.z);
        sprite.scale.set(0.8, 0.4, 1);
        return sprite;
    }

    const panels = [];
    const panelConfigs = [
        {
            lines: ['GLOBAL DATA', 'VIZUALIZATION', 'SYSTEMS: v7.2', 'DIAGNOSTICS'],
            color: '#00ffc8',
            pos: new THREE.Vector3(2.8, 0.2, 0.5)
        },
        {
            lines: ['NEURAL NETWORK', 'NODES: 1.8K', 'SYN: 3.0K', 'STATUS: ACTIVE'],
            color: '#ff0066',
            pos: new THREE.Vector3(-2.2, 1.0, -1.5)
        },
        {
            lines: ['POPULATION DENSITY', 'URBAN: 56.3%', 'RURAL: 43.7%', 'TREND: +1.2%/y'],
            color: '#00ff88',
            pos: new THREE.Vector3(1.5, -1.2, 2.5)
        },
        {
            lines: ['CLIMATE DATA', 'TMP +1.8C', 'CO2 421ppm', 'SEA +3.2mm/y'],
            color: '#00ffc8',
            pos: new THREE.Vector3(-2.5, -0.8, -1.8)
        },
        {
            lines: ['DATA STREAMS', 'TX 1.2 Tbps', 'RX 0.8 Tbps', 'LAT 12ms'],
            color: '#ff0066',
            pos: new THREE.Vector3(2.0, 1.5, -1.2)
        },
    ];

    for (const cfg of panelConfigs) {
        const panel = createPanel(cfg.lines, cfg.color, cfg.pos);
        scene.add(panel);
        panels.push({ sprite: panel, basePos: cfg.pos.clone(), time: Math.random() * 100 });
    }

    // --- 5. BACKGROUND PARTICLES ---
    const starCount = 800;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        const r = 5 + Math.random() * 15;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
        starPos[i*3+1] = r * Math.cos(phi);
        starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
        color: 0x444466,
        size: 0.015,
        transparent: true,
        opacity: 0.4,
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // --- POST-PROCESSING ---
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.8, 0.3, 0.05
    );
    bloomPass.threshold = 0.1;
    bloomPass.strength = 0.6;
    bloomPass.radius = 0.3;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // --- FILM GRAIN ---
    {
        const gc = document.getElementById('grain');
        gc.width = window.innerWidth;
        gc.height = window.innerHeight;
        const gctx = gc.getContext('2d');
        function drawGrain() {
            const w = gc.width, h = gc.height;
            const id = gctx.createImageData(w, h);
            for (let i = 0; i < id.data.length; i += 4) {
                const v = Math.random() * 255;
                id.data[i] = v; id.data[i+1] = v; id.data[i+2] = v; id.data[i+3] = 255;
            }
            gctx.putImageData(id, 0, 0);
        }
        drawGrain();
        window.addEventListener('resize', () => {
            gc.width = window.innerWidth; gc.height = window.innerHeight;
            drawGrain();
        });
    }

    // --- AMPLITUDE ---
    let currentAmp = 0;
    let targetAmp = 0;
    const linePos = lineGeo.attributes.position;
    const nodePosAttr = nodeGeo.attributes.position;

    function connectSSE() {
        const evtSource = new EventSource('/api/stream');
        evtSource.onmessage = (event) => {
            try {
                const d = JSON.parse(event.data);
                targetAmp = d.amplitude || 0;
                const dot = document.getElementById('status-dot');
                dot.className = targetAmp > 0.05 ? 'falando' : '';
            } catch(e) {}
        };
        evtSource.onerror = () => {
            evtSource.close();
            setTimeout(connectSSE, 1000);
        };
    }
    connectSSE();

    // --- ANIMATION ---
    let time = 0;

    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        currentAmp += (targetAmp - currentAmp) * 0.12;
        const amp = Math.min(currentAmp * 2.5, 1.0);

        // Nodes pulse
        const pulse = 1 + amp * 0.04;
        nodeMat.size = 0.02 + amp * 0.035;
        nodeMat.opacity = 0.7 + amp * 0.3;

        // Animate node positions (subtle wave)
        const pos = nodeGeo.attributes.position.array;
        for (let i = 0; i < NUM_NODOS; i++) {
            const wave = Math.sin(time * 2 + i * 0.05) * amp * 0.006;
            const factor = 1 + wave;
            pos[i*3] = nodeBasePos[i*3] * factor;
            pos[i*3+1] = nodeBasePos[i*3+1] * factor;
            pos[i*3+2] = nodeBasePos[i*3+2] * factor;
        }
        nodeGeo.attributes.position.needsUpdate = true;

        // Lines pulse
        lineMat.opacity = 0.2 + amp * 0.4;

        // Bloom pulse
        bloomPass.strength = 0.4 + amp * 2.5;

        // Panels float
        for (const p of panels) {
            p.time += 0.01;
            const s = p.sprite;
            const b = p.basePos;
            s.position.x = b.x + Math.sin(p.time * 0.5 + p.time) * 0.08;
            s.position.y = b.y + Math.cos(p.time * 0.7) * 0.08;
            s.position.z = b.z + Math.sin(p.time * 0.6 + p.time) * 0.08;
            s.material.opacity = 0.5 + amp * 0.4;
        }

        // Rings rotate
        ring.rotation.z += 0.002;
        ring2.rotation.x += 0.001;

        // Stars rotate slowly
        stars.rotation.y += 0.0003;

        // Globe scale
        const scale = 1 + amp * 0.02;
        nodeMesh.scale.set(scale, scale, scale);
        lineMesh.scale.set(scale, scale, scale);

        controls.update();
        composer.render();
    }

    animate();

    // --- RESIZE ---
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
