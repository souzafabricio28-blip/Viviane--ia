<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkSON - Painel Central</title>
    <link rel="stylesheet" href="/static/style.css?v=1">
</head>
<body>
    <div class="chat-panel">
        <div class="chat-header">
            <span class="status-dot" id="status-dot"></span>
            <div>
                <h1>DarkSON</h1>
                <div class="sub">PAINEL CENTRAL</div>
            </div>
        </div>

        <div class="chat-mic">
            <button class="mic-btn" id="mic-btn"
                onmousedown="iniciarGravacao()" onmouseup="pararGravacao()"
                ontouchstart="iniciarGravacao()" ontouchend="pararGravacao()">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <span class="mic-label" id="mic-label">Segure para falar</span>
        </div>

        <div class="amp-container"><div class="amp-bar" id="amp-bar"></div></div>

        <div class="text-input" style="position:relative">
            <div class="autocomplete-list" id="autocomplete-list"></div>
            <input type="text" id="text-input" placeholder="digite um comando..." onkeypress="if(event.key==='Enter')enviarTexto()">
            <button onclick="enviarTexto()" class="send-btn">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="welcome-msg">_ DarkSON aguarda comando _</div>
            <div class="typing-indicator" id="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="chat-toolbar">
            <button onclick="limparConversa()">Limpar</button>
            <button onclick="abrirComandos()">Comandos</button>
            <button onclick="abrirMemorias()">Memorias</button>
            <button onclick="abrirConhecimento()">Base</button>
            <button onclick="downloadBanco()">DB</button>
            <button onclick="testarMic()" title="Testar microfone">Mic</button>
            <button class="theme-btn" onclick="toggleTema()">☾</button>
        </div>
    </div>

    <div class="globe-panel" id="globe-container">
        <canvas id="grain"></canvas>
        <div class="globe-label">DarkSON — neural core</div>
    </div>

    <!-- OVERLAY: COMANDOS -->
    <div class="overlay" id="overlay-comandos">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h2>Comandos Executados</h2>
                <button class="overlay-close" onclick="fecharOverlays()">x</button>
            </div>
            <div class="overlay-body" id="ov-body-comandos">
                <div class="ov-empty">Carregando...</div>
            </div>
        </div>
    </div>

    <!-- OVERLAY: MEMORIAS -->
    <div class="overlay" id="overlay-memorias">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h2>Memorias</h2>
                <button class="overlay-close" onclick="fecharOverlays()">x</button>
            </div>
            <div class="overlay-tabs">
                <button class="overlay-tab active" data-tab="memorias" onclick="ativarTabMemorias('memorias')">Memorias</button>
                <button class="overlay-tab" data-tab="conversas" onclick="ativarTabMemorias('conversas')">Conversas</button>
                <button class="overlay-tab" data-tab="perfil" onclick="ativarTabMemorias('perfil')">Perfil</button>
            </div>
            <div class="overlay-body">
                <div class="overlay-content active" id="ov-mem-memorias"></div>
                <div class="overlay-content" id="ov-mem-conversas"></div>
                <div class="overlay-content" id="ov-mem-perfil"></div>
            </div>
        </div>
    </div>

    <!-- OVERLAY: CONHECIMENTO -->
    <div class="overlay" id="overlay-conhecimento">
        <div class="overlay-panel">
            <div class="overlay-header">
                <h2>Base de Conhecimento</h2>
                <button class="overlay-close" onclick="fecharOverlays()">x</button>
            </div>
            <div class="overlay-body" id="ov-body-conhecimento">
                <div class="ov-empty">Carregando...</div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    const container = document.getElementById('globe-container');
    const w = container.clientWidth;
    const h = container.clientHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020208);

    const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
    camera.position.set(0, 0.6, 4.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.maxPolarAngle = Math.PI / 2;
    controls.minPolarAngle = 0.2;

    const NUM_NODOS = 1800;
    const NUM_CONNECTIONS = 3000;

    const colorCyan = new THREE.Color(0x00ffc8);
    const colorGreen = new THREE.Color(0x00ff88);
    const colorMagenta = new THREE.Color(0xff0066);

    const nodePositions = new Float32Array(NUM_NODOS * 3);
    const nodeColors = new Float32Array(NUM_NODOS * 3);
    const nodeSizes = new Float32Array(NUM_NODOS);
    const nodeBasePos = new Float32Array(NUM_NODOS * 3);

    function genNodeColorsSizes() {
        for (let i = 0; i < NUM_NODOS; i++) {
            const px = nodeBasePos[i*3], py = nodeBasePos[i*3+1], pz = nodeBasePos[i*3+2];
            const theta = Math.atan2(pz, px);
            const phi = Math.acos(Math.max(-1, Math.min(1, -py / 1.2)));
            const landNoise = Math.sin(theta * 3 + phi * 2) * Math.cos(phi * 4 + theta * 1.5)
                + Math.sin(theta * 5 + phi * 3) * 0.4 + Math.cos(theta * 2 - phi * 6) * 0.3
                + Math.sin(theta * 7 + phi * 5) * 0.2;
            const isLand = landNoise > 0.0;
            const shade = 0.5 + Math.random() * 0.4;
            if (isLand) {
                const g = (0.15 + Math.random() * 0.35) * shade;
                nodeColors[i*3] = (0.04 + Math.random() * 0.08) * shade;
                nodeColors[i*3+1] = g;
                nodeColors[i*3+2] = (0.02 + Math.random() * 0.04) * shade;
            } else {
                nodeColors[i*3] = (0.01 + Math.random() * 0.04) * shade;
                nodeColors[i*3+1] = (0.03 + Math.random() * 0.06) * shade;
                nodeColors[i*3+2] = (0.15 + Math.random() * 0.25) * shade;
            }
            const overlay = 0.08 * Math.sin(px * 8 + py * 6 + pz * 8);
            nodeColors[i*3] = Math.min(1, nodeColors[i*3] + overlay * 0.15);
            nodeColors[i*3+1] = Math.min(1, nodeColors[i*3+1] + overlay * 0.8);
            nodeColors[i*3+2] = Math.min(1, nodeColors[i*3+2] + overlay * 0.4);
            nodeSizes[i] = 1 + Math.random() * 2;
        }
    }

    function fillHeadShape() {
        for (let i = 0; i < NUM_NODOS; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 1.2 + (Math.random() - 0.5) * 0.04;
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = -r * Math.cos(phi);
            const z = r * Math.sin(phi) * Math.sin(theta);
            nodePositions[i*3] = x; nodePositions[i*3+1] = y; nodePositions[i*3+2] = z;
            nodeBasePos[i*3] = x; nodeBasePos[i*3+1] = y; nodeBasePos[i*3+2] = z;
        }
        genNodeColorsSizes();
    }

    fillHeadShape();

    function buildLines() {
        const lv = []; const lc = [];
        for (let i = 0; i < NUM_CONNECTIONS; i++) {
            const a = Math.floor(Math.random() * NUM_NODOS);
            const b = Math.floor(Math.random() * NUM_NODOS);
            if (a === b) continue;
            const dist = Math.sqrt(
                (nodeBasePos[a*3]-nodeBasePos[b*3])**2 + (nodeBasePos[a*3+1]-nodeBasePos[b*3+1])**2 + (nodeBasePos[a*3+2]-nodeBasePos[b*3+2])**2
            );
            if (dist > 0.8 || dist < 0.1) continue;
            lv.push(nodeBasePos[a*3], nodeBasePos[a*3+1], nodeBasePos[a*3+2], nodeBasePos[b*3], nodeBasePos[b*3+1], nodeBasePos[b*3+2]);
            const bri = Math.max(0.1, 1 - dist / 0.8) * 0.5;
            const nearFace = (nodeBasePos[a*3+2] > 0.3 || nodeBasePos[b*3+2] > 0.3);
            const isMagenta = Math.random() < 0.15 || (nearFace && Math.random() < 0.3);
            if (isMagenta) {
                lc.push(bri, 0, bri*0.4, bri, 0, bri*0.4);
            } else {
                lc.push(0, bri*0.9, bri*0.7, 0, bri*0.9, bri*0.7);
            }
        }
        const lg = new THREE.BufferGeometry();
        lg.setAttribute('position', new THREE.Float32BufferAttribute(lv, 3));
        lg.setAttribute('color', new THREE.Float32BufferAttribute(lc, 3));
        return lg;
    }

    const nodeGeo = new THREE.BufferGeometry();
    nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePositions, 3));
    nodeGeo.setAttribute('color', new THREE.BufferAttribute(nodeColors, 3));
    nodeGeo.setAttribute('size', new THREE.BufferAttribute(nodeSizes, 1));

    const nodeMat = new THREE.PointsMaterial({
        size: 0.028, vertexColors: true, transparent: true, opacity: 0.85,
        blending: THREE.AdditiveBlending, sizeAttenuation: true, depthWrite: false,
    });
    const nodeMesh = new THREE.Points(nodeGeo, nodeMat);
    scene.add(nodeMesh);

    let lineGeo = buildLines();
    const lineMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending });
    let lineMesh = new THREE.LineSegments(lineGeo, lineMat);
    scene.add(lineMesh);

    const faceLoader = new OBJLoader();
    const faceUrl = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/models/obj/Face.obj';
    let faceReady = false;
    faceLoader.load(faceUrl, (obj) => {
        obj.traverse((c) => {
            if (!c.isMesh) return;
            const pos = c.geometry.attributes.position;
            if (pos.count < 100) return;
            for (let i = 0; i < NUM_NODOS; i++) {
                const idx = Math.floor(Math.random() * pos.count) * 3;
                const s = 1.8;
                nodePositions[i*3] = pos.array[idx] * s;
                nodePositions[i*3+1] = pos.array[idx+1] * s;
                nodePositions[i*3+2] = pos.array[idx+2] * s;
                nodeBasePos[i*3] = nodePositions[i*3];
                nodeBasePos[i*3+1] = nodePositions[i*3+1];
                nodeBasePos[i*3+2] = nodePositions[i*3+2];
            }
            faceReady = true;
            nodeGeo.attributes.position.needsUpdate = true;
            scene.remove(lineMesh);
            lineMesh.geometry.dispose();
            lineGeo = buildLines();
            lineMesh = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(lineMesh);
        });
    }, undefined, () => {});
    setTimeout(() => {
        if (!faceReady) {
            fillHeadShape();
            nodeGeo.attributes.position.needsUpdate = true;
            scene.remove(lineMesh);
            lineMesh.geometry.dispose();
            lineGeo = buildLines();
            lineMesh = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(lineMesh);
        }
    }, 6000);

    const ringPts = [];
    for (let i = 0; i <= 80; i++) {
        const t = (i/80)*Math.PI*2;
        ringPts.push(new THREE.Vector3(Math.cos(t)*1.8, Math.sin(t)*1.8*0.25, 0));
    }
    const rGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
    const rMat = new THREE.LineBasicMaterial({ color: 0x00ffc8, transparent: true, opacity: 0.06 });
    const ring = new THREE.Line(rGeo, rMat);
    ring.rotation.x = 0.4;
    scene.add(ring);
    const ring2 = ring.clone();
    ring2.material = rMat.clone(); ring2.material.color.setHex(0xff0066); ring2.material.opacity = 0.03;
    ring2.rotation.z = 1.0; ring2.scale.set(1.3,1.3,1.3);
    scene.add(ring2);

    const starCount = 500;
    const sGeo = new THREE.BufferGeometry();
    const sPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
        const r = 5 + Math.random() * 15, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
        sPos[i*3] = r*Math.sin(ph)*Math.cos(th); sPos[i*3+1] = r*Math.cos(ph); sPos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    }
    sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
    const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0x444466, size: 0.012, transparent: true, opacity: 0.3 }));
    scene.add(stars);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(w, h), 0.8, 0.3, 0.05);
    bloomPass.threshold = 0.1; bloomPass.strength = 0.6; bloomPass.radius = 0.3;
    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene); composer.addPass(bloomPass);

    {
        const gc = document.getElementById('grain');
        gc.width = window.innerWidth;
        gc.height = window.innerHeight;
        const gctx = gc.getContext('2d');
        function drawGrain() {
            const w = gc.width, h = gc.height;
            const id = gctx.createImageData(w, h);
            for (let i = 0; i < id.data.length; i += 4) {
                const v = Math.random() * 255;
                id.data[i] = v; id.data[i+1] = v; id.data[i+2] = v; id.data[i+3] = 255;
            }
            gctx.putImageData(id, 0, 0);
        }
        drawGrain();
        window.addEventListener('resize', () => {
            gc.width = window.innerWidth; gc.height = window.innerHeight;
            drawGrain();
        });
    }

    let currentAmp = 0, targetAmp = 0, time = 0;
    const nodePosAttr = nodeGeo.attributes.position;

    function connectSSE() {
        const evtSource = new EventSource('/api/stream');
        evtSource.onmessage = (event) => {
            try {
                const d = JSON.parse(event.data);
                targetAmp = d.amplitude || 0;
                document.getElementById('status-dot').className = targetAmp > 0.05 ? 'status-dot falando' : 'status-dot';
            } catch(e) {}
        };
        evtSource.onerror = () => {
            evtSource.close();
            setTimeout(connectSSE, 1000);
        };
    }
    connectSSE();

    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        currentAmp += (targetAmp - currentAmp) * 0.12;
        const amp = Math.min(currentAmp * 2.5, 1.0);

        nodeMat.size = 0.02 + amp * 0.035;
        nodeMat.opacity = 0.7 + amp * 0.3;
        lineMat.opacity = 0.15 + amp * 0.35;
        bloomPass.strength = 0.4 + amp * 2.5;

        const pos = nodePosAttr.array;
        for (let i = 0; i < NUM_NODOS; i++) {
            const wave = Math.sin(time * 2 + i * 0.05) * amp * 0.006;
            const f = 1 + wave;
            pos[i*3] = nodeBasePos[i*3]*f; pos[i*3+1] = nodeBasePos[i*3+1]*f; pos[i*3+2] = nodeBasePos[i*3+2]*f;
        }
        nodePosAttr.needsUpdate = true;

        const s = 1 + amp * 0.02;
        nodeMesh.scale.set(s,s,s); lineMesh.scale.set(s,s,s);
        ring.rotation.z += 0.002;
        stars.rotation.y += 0.0003;
        controls.update();
        composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
        const cw = container.clientWidth, ch = container.clientHeight;
        camera.aspect = cw / ch; camera.updateProjectionMatrix();
        renderer.setSize(cw, ch); composer.setSize(cw, ch);
    });
    </script>

    <script src="/static/script.js?v=4"></script>
</body>
</html>
